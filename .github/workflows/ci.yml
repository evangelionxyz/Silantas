name: CI & Auto Release

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
      - 'vercel.json'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force build & release the desktop even if the version already exists'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: evangelionxyz/silantas-api

jobs:
  build-and-push:
    name: Build & Push API Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-dewacloud:
    name: Deploy API to DewaCloud Docker CE
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on DewaCloud via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEWACLOUD_SSH_HOST }}
          port: ${{ vars.DEWACLOUD_SSH_PORT }}
          username: ${{ vars.DEWACLOUD_SSH_USER }}
          key: ${{ secrets.DEWACLOUD_SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            OLD_IMAGE_ID=$(docker images -q ghcr.io/${{ env.IMAGE_NAME }}:latest)
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest
            NEW_IMAGE_ID=$(docker images -q ghcr.io/${{ env.IMAGE_NAME }}:latest)
            docker stop silantas-api || true
            docker rm silantas-api || true
            docker run -d --name silantas-api --restart unless-stopped -p 80:8000 --env-file ~/Silantas/.env \
              ghcr.io/${{ env.IMAGE_NAME }}:latest
            if [ -n "$OLD_IMAGE_ID" ] && [ "$OLD_IMAGE_ID" != "$NEW_IMAGE_ID" ]; then
              docker rmi "$OLD_IMAGE_ID" || true
            fi

  deploy-to-vercel:
    name: Deploy Web to Vercel (event)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"
